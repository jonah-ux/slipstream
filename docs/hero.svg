<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Slipstream local index</title>
  <desc id="desc">A local vector index turns a bounded corpus into fast, inspectable retrieval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071a35"/><stop offset="1" stop-color="#1b4e73"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#76ddff"/><stop offset="1" stop-color="#b9a8ff"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <path d="M80 218h1040" stroke="#244c70" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="80" y="82" fill="#f4f8ff" font-size="42" font-weight="700" letter-spacing="5">SLIPSTREAM</text>
    <text x="84" y="116" fill="#a9c6e4" font-size="15" letter-spacing="3">LOCAL INDEX · FAST RETRIEVAL · CHECKABLE OUTPUT</text>
    <g transform="translate(100 158)"><rect width="190" height="62" rx="14" fill="#12385b" stroke="#5bcfff" stroke-width="2"/><text x="20" y="27" fill="#74d7ff" font-size="13" letter-spacing="2">01 / BUILD</text><text x="20" y="49" fill="#f2f7ff" font-size="16">bounded corpus</text></g>
    <g transform="translate(365 158)"><rect width="190" height="62" rx="14" fill="#24265d" stroke="#a99cff" stroke-width="2"/><text x="20" y="27" fill="#c3baff" font-size="13" letter-spacing="2">02 / QUERY</text><text x="20" y="49" fill="#f2f7ff" font-size="16">local KNN</text></g>
    <g transform="translate(630 158)"><rect width="190" height="62" rx="14" fill="#174b50" stroke="#8ce6ca" stroke-width="2"/><text x="20" y="27" fill="#a8f0d1" font-size="13" letter-spacing="2">03 / PROVE</text><text x="20" y="49" fill="#f2f7ff" font-size="16">JSON receipt</text></g>
    <path d="M305 189h42M570 189h42" stroke="url(#beam)" stroke-width="3"/><path d="m338 181 12 8-12 8M603 181l12 8-12 8" fill="none" stroke="#b9eaff" stroke-width="3"/>
    <g transform="translate(900 150)"><circle cx="75" cy="38" r="55" fill="#0b2543" stroke="#74d7ff" stroke-width="3"/><circle cx="75" cy="38" r="30" fill="none" stroke="#a8f0d1" stroke-width="3"/><circle cx="75" cy="38" r="7" fill="#b9a8ff"/><text x="75" y="124" fill="#b9cce6" text-anchor="middle" font-size="13" letter-spacing="2">NO POOLER</text></g>
  </g>
</svg>
