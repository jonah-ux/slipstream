name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm test
      - name: Public surface audit
        run: node scripts/audit_public_surface.js --json
      - name: verify packed consumer
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/slipstream-package"
          consumer_dir="$RUNNER_TEMP/slipstream-consumer"
          mkdir -p "$package_dir" "$consumer_dir"
          package_file="$(npm pack --silent --pack-destination "$package_dir")"
          cd "$consumer_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$package_dir/$package_file"
          npm rebuild better-sqlite3
          ./node_modules/.bin/slipstream self-test
